name: Plugin Check

on:
  pull_request:
  push:
    branches: [ tmp/pcb-base, tmp/pcb-file ]
  workflow_dispatch:

concurrency:
  group: plugin-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-check:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml@tmp/pc-bl-verify
    with:
      plugin-slug: give
      mode: strict
      cache-paths: .cache/webpack
      exclude-checks: |
        enqueued_scripts_scope
        enqueued_scripts_size
        enqueued_styles_scope
        enqueued_styles_size
        non_blocking_scripts

name: Plugin Check

# Throwaway caller for probe-called.yml. Named plugin-check.yml on purpose: that is the file name
# the real callers keep.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/probe-called.yml

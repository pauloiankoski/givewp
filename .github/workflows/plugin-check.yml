name: Plugin Check

on:
  pull_request:
  push:
    branches: [tmp/pc-js-base]
  workflow_dispatch:

concurrency:
  group: plugin-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-check:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: stellarwp/plugin-toolbox/.github/workflows/plugin-check.yml@tmp/pc-js-verify
    with:
      plugin-slug: give
      runs-on: ubuntu-latest
      cache-paths: .cache/webpack
      build-command: |
        sleep 480
        composer run -q pup > /dev/null
        composer -- pup build
        version=$(php -d display_errors=0 bin/pup.phar get-version --dev)
        composer -- pup package "$version"
        name=$(php -d display_errors=0 bin/pup.phar zip-name "$version")
        unzip -q "$name.zip" -d "$PLUGIN_CHECK_BUILD_DIR"

      exclude-checks: |
        enqueued_scripts_scope
        enqueued_scripts_size
        enqueued_styles_scope
        enqueued_styles_size
        non_blocking_scripts

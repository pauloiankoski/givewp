name: Playground Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: playground-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playground-preview:
    permissions:
      contents: read
      pull-requests: write
    uses: stellarwp/plugin-toolbox/.github/workflows/playground-preview.yml@tmp/playground-preview-fork-test
    with:
      blueprints: |
        .github/playground/blueprint.json
        .github/playground/blueprint-sample-data.json

name: pp verify
on:
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: pp-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pp:
    permissions:
      contents: read
      pull-requests: write
    uses: stellarwp/plugin-toolbox/.github/workflows/playground-preview.yml@tmp/pp-js-verify
    with:
      zip-url: "https://evnt.is/test-zip?file=give.4.19.1-dev-1793811419-536ab288.zip"
